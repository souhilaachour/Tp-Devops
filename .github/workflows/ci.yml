name: CI

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd starter-app2
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          cd starter-app2
          flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd starter-app2
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd starter-app2
          pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./starter-app2
          push: true
          tags: |
            souhiladek/test:latest
            souhiladek/test:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest

    needs: build-and-push

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy script
        run: |
          ls -la starter-app2/deploy

      - name: Make deploy script executable
        run: |
          chmod +x starter-app2/deploy.sh

      - name: Run deployment
        run: |
          cd starter-app2
          bash deploy.sh
