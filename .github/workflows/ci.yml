name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd starter-app2
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          cd starter-app2
          flake8 .

test:
  runs-on: ubuntu-latest
  needs: lint

  strategy:
    matrix:
      python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd starter-app2
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd starter-app2
          pytest -v